name: innovalley-menu-bot

services:
  menu-bot:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/menu.db
      - TZ=Asia/Seoul
      - MENU_SEND_NOT_BEFORE=${MENU_SEND_NOT_BEFORE}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
      - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID}
      - KAKAO_CHANNEL_URL=https://pf.kakao.com/_LCxlxlxb/posts
      - PORT=3000
    volumes:
      - menu-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  menu-data:
    driver: local
